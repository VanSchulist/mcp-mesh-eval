  <!-- Background -->
  <rect width="1000" height="580" rx="16" fill="url(#bgGlow)" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(45, 45)">
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" letter-spacing="1.5">EXISTENTIAL CLOUD RESEARCH</text>
    <text y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#faf5ee">
      mcp-mesh-eval: Turn-0 Token Overhead &amp; TTFT Latency (60 Enterprise Tools)
    </text>
    <text y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#a89f91">
      Comparing Raw MCP static injection (~9.8k tokens) vs. mcp-mesh lazy meta-tools (384 tokens)
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(680, 50)">
    <rect width="14" height="14" rx="4" fill="url(#rawBarGrad)" />
    <text x="22" y="12" font-family="sans-serif" font-size="13" font-weight="600" fill="#d6cebe">Raw MCP (Static)</text>
    <rect x="155" width="14" height="14" rx="4" fill="url(#meshBarGrad)" />
    <text x="177" y="12" font-family="sans-serif" font-size="13" font-weight="600" fill="#f59e0b">mcp-mesh Gateway</text>
  </g>

