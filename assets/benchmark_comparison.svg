      <text y="34" font-family="sans-serif" font-size="12" fill="#a89f91">TTFT Latency: 601.2ms vs 206.1ms (-66%)</text>
      <rect x="230" y="4" width="480" height="18" rx="4" fill="url(#rawBarGrad)" />
      <text x="720" y="18" font-family="monospace" font-size="12" fill="#fda4af" font-weight="700">9,790 tokens ($19.58/1k)</text>
      <rect x="230" y="26" width="18" height="18" rx="4" fill="url(#meshBarGrad)" />
      <text x="258" y="40" font-family="monospace" font-size="12" fill="#fde68a" font-weight="700">384 tokens ($0.77/1k) [-96.1%]</text>
    </g>
    <!-- Row: Gemini 3.8 Flash -->
    <g transform="translate(0, 210)">
      <text y="16" font-family="sans-serif" font-size="14" font-weight="700" fill="#faf5ee">Gemini 3.8 Flash (Google DeepMind)</text>
      <text y="34" font-family="sans-serif" font-size="12" fill="#a89f91">TTFT Latency: 271.2ms vs 101.9ms (-62%)</text>
      <rect x="230" y="4" width="480" height="18" rx="4" fill="url(#rawBarGrad)" />
      <text x="720" y="18" font-family="monospace" font-size="12" fill="#fda4af" font-weight="700">9,790 tokens ($7.34/1k)</text>
      <rect x="230" y="26" width="18" height="18" rx="4" fill="url(#meshBarGrad)" />
      <text x="258" y="40" font-family="monospace" font-size="12" fill="#fde68a" font-weight="700">384 tokens ($0.29/1k) [-96.1%]</text>
    </g>
    <!-- Row: DeepSeek-V4.1-Flash -->
    <g transform="translate(0, 280)">
      <text y="16" font-family="sans-serif" font-size="14" font-weight="700" fill="#faf5ee">DeepSeek-V4.1-Flash (DeepSeek)</text>
      <text y="34" font-family="sans-serif" font-size="12" fill="#a89f91">TTFT Latency: 453.3ms vs 152.3ms (-66%)</text>
      <rect x="230" y="4" width="480" height="18" rx="4" fill="url(#rawBarGrad)" />
      <text x="720" y="18" font-family="monospace" font-size="12" fill="#fda4af" font-weight="700">9,790 tokens ($1.47/1k)</text>
      <rect x="230" y="26" width="18" height="18" rx="4" fill="url(#meshBarGrad)" />
      <text x="258" y="40" font-family="monospace" font-size="12" fill="#fde68a" font-weight="700">384 tokens ($0.06/1k) [-96.1%]</text>
