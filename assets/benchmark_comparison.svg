      <text y="34" font-family="sans-serif" font-size="12" fill="#a89f91">TTFT Latency: 1152.2ms vs 352.6ms (-69%)</text>
      <rect x="230" y="4" width="480" height="18" rx="4" fill="url(#rawBarGrad)" />
      <text x="720" y="18" font-family="monospace" font-size="12" fill="#fda4af" font-weight="700">9,790 tokens ($97.90/1k)</text>
      <rect x="230" y="26" width="18" height="18" rx="4" fill="url(#meshBarGrad)" />
      <text x="258" y="40" font-family="monospace" font-size="12" fill="#fde68a" font-weight="700">384 tokens ($3.84/1k) [-96.1%]</text>
    </g>
    <!-- Row: GPT-6.1 Sol -->
    <g transform="translate(0, 70)">
      <text y="16" font-family="sans-serif" font-size="14" font-weight="700" fill="#faf5ee">GPT-6.1 Sol (OpenAI)</text>
      <text y="34" font-family="sans-serif" font-size="12" fill="#a89f91">TTFT Latency: 620.5ms vs 197.3ms (-68%)</text>
      <rect x="230" y="4" width="480" height="18" rx="4" fill="url(#rawBarGrad)" />
      <text x="720" y="18" font-family="monospace" font-size="12" fill="#fda4af" font-weight="700">9,790 tokens ($19.58/1k)</text>
      <rect x="230" y="26" width="18" height="18" rx="4" fill="url(#meshBarGrad)" />
      <text x="258" y="40" font-family="monospace" font-size="12" fill="#fde68a" font-weight="700">384 tokens ($0.77/1k) [-96.1%]</text>
    </g>
    <!-- Row: Claude Sonnet 5.5 -->
