<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440">
  <defs>
    <linearGradient id="roseBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="amberBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="840" height="440" rx="16" fill="#12100d" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#faf5ee">
    Empirical Turn-0 Token Overhead (60 Enterprise Tools)
  </text>
  <text x="40" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#a89f91">
    Turn-0 schema injection before user prompt • Evaluated on September 2026 frontier models
  </text>

  <!-- Legend -->
  <g transform="translate(560, 40)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#roseBar)" />
    <text x="22" y="11" font-family="sans-serif" font-size="12" fill="#d6d3d1">Raw MCP Dump</text>

    <rect x="140" y="0" width="14" height="14" rx="3" fill="url(#amberBar)" />
    <text x="162" y="11" font-family="sans-serif" font-size="12" fill="#d6d3d1">mcp-mesh</text>
  </g>

  <!-- Main Comparison Bar Section -->
  <g transform="translate(40, 115)">
    <!-- Baseline Bar -->
    <text x="0" y="24" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Raw MCP (Static Schemas)</text>
    <rect x="230" y="8" width="530" height="28" rx="6" fill="url(#roseBar)" opacity="0.95" />
    <text x="770" y="27" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#fda4af">13,200 tokens</text>

    <!-- mcp-mesh Bar -->
    <text x="0" y="76" font-family="sans-serif" font-size="14" font-weight="600" fill="#f59e0b">With mcp-mesh Gateway</text>
    <rect x="230" y="60" width="22" height="28" rx="6" fill="url(#amberBar)" />
    <text x="262" y="79" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#fde68a">380 tokens</text>
    <text x="350" y="79" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399">(-97.1% NET SAVING)</text>
  </g>

  <!-- Grid Divider -->
  <line x1="40" y1="240" x2="800" y2="240" stroke="#f59e0b" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Multi-Model Token Cost Comparison Table (10,000 Turns) -->
  <g transform="translate(40, 260)">
    <text x="0" y="0" font-family="sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-transform="uppercase" letter-spacing="1">
      Estimated Cost for 10,000 Agent Turns
    </text>

    <!-- Header -->
    <g transform="translate(0, 20)" font-family="sans-serif" font-size="12" font-weight="600" fill="#888">
      <text x="0" y="0">Target Model (Sept 2026)</text>
      <text x="260" y="0">Raw Baseline</text>
      <text x="440" y="0">With mcp-mesh</text>
      <text x="630" y="0">Direct Savings ($)</text>
    </g>

    <!-- Row 1: GPT-6 Astra -->
    <g transform="translate(0, 48)" font-family="'JetBrains Mono', monospace" font-size="13">
      <text x="0" y="0" fill="#faf5ee" font-weight="600">GPT-6 Astra ($10/M)</text>
      <text x="260" y="0" fill="#fda4af">$1,320.00</text>
      <text x="440" y="0" fill="#fde68a">$38.00</text>
      <text x="630" y="0" fill="#34d399" font-weight="700">-$1,282.00 (97.1%)</text>
    </g>

    <!-- Row 2: Claude Sonnet 5.5 -->
    <g transform="translate(0, 78)" font-family="'JetBrains Mono', monospace" font-size="13">
      <text x="0" y="0" fill="#faf5ee" font-weight="600">Claude Sonnet 5.5 ($2/M)</text>
      <text x="260" y="0" fill="#fda4af">$264.00</text>
      <text x="440" y="0" fill="#fde68a">$7.60</text>
      <text x="630" y="0" fill="#34d399" font-weight="700">-$256.40 (97.1%)</text>
    </g>

    <!-- Row 3: Gemini 3.8 Flash -->
    <g transform="translate(0, 108)" font-family="'JetBrains Mono', monospace" font-size="13">
      <text x="0" y="0" fill="#faf5ee" font-weight="600">Gemini 3.8 Flash ($0.75/M)</text>
      <text x="260" y="0" fill="#fda4af">$99.00</text>
      <text x="440" y="0" fill="#fde68a">$2.85</text>
      <text x="630" y="0" fill="#34d399" font-weight="700">-$96.15 (97.1%)</text>
    </g>

    <!-- Row 4: DeepSeek-V4.1-Flash -->
    <g transform="translate(0, 138)" font-family="'JetBrains Mono', monospace" font-size="13">
      <text x="0" y="0" fill="#faf5ee" font-weight="600">DeepSeek-V4.1-Flash ($0.15/M)</text>
      <text x="260" y="0" fill="#fda4af">$19.80</text>
      <text x="440" y="0" fill="#fde68a">$0.57</text>
      <text x="630" y="0" fill="#34d399" font-weight="700">-$19.23 (97.1%)</text>
    </g>
  </g>
</svg>
