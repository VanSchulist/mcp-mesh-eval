[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-mesh-eval"
version = "1.0.0"
description = "Empirical Benchmark Suite: Evaluating Dynamic MCP Routing vs. Static Schema Injection"
readme = "README.md"
authors = [
    { name = "Van Schulist", email = "vanschulist@existentialcloud.dev" }
]
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "evals", "benchmark", "llm-agents", "token-optimization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mcp-mesh-eval = "mcp_mesh_eval.cli:main"

[project.urls]
Homepage = "https://www.existentialcloud.ccwu.cc"
Repository = "https://github.com/VanSchulist/mcp-mesh-eval.git"
Documentation = "https://www.existentialcloud.ccwu.cc"
Issues = "https://github.com/VanSchulist/mcp-mesh-eval/issues"

[tool.setuptools.packages.find]
include = ["mcp_mesh_eval*"]
